<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0078d4"/>
  <circle cx="64" cy="64" r="56" fill="#1a1a2e"/>

  <!-- Shield shape -->
  <path d="M64 20 L100 38 L100 68 C100 90 82 106 64 112 C46 106 28 90 28 68 L28 38 Z"
        fill="none" stroke="#0078d4" stroke-width="3" opacity="0.8"/>

  <!-- Key icon (shifted left to make room for Tux) -->
  <g transform="translate(52,58)">
    <circle cx="0" cy="-12" r="13" fill="none" stroke="#00bcf2" stroke-width="3"/>
    <circle cx="0" cy="-12" r="5" fill="#00bcf2" opacity="0.3"/>
    <line x1="0" y1="1" x2="0" y2="28" stroke="#00bcf2" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="7" y2="20" stroke="#00bcf2" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="5" y2="26" stroke="#00bcf2" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tux penguin (larger, positioned top-right) -->
  <g transform="translate(86,32)">
    <!-- Body -->
    <ellipse cx="0" cy="2" rx="11" ry="14" fill="#2a2a2a"/>
    <!-- Belly -->
    <ellipse cx="0" cy="4" rx="7" ry="10" fill="#e8e8e8"/>
    <!-- Head -->
    <circle cx="0" cy="-12" r="9" fill="#2a2a2a"/>
    <!-- Eyes -->
    <ellipse cx="-3.5" cy="-14" rx="2.5" ry="3" fill="white"/>
    <ellipse cx="3.5" cy="-14" rx="2.5" ry="3" fill="white"/>
    <circle cx="-3" cy="-14" r="1.3" fill="#1a1a2e"/>
    <circle cx="4" cy="-14" r="1.3" fill="#1a1a2e"/>
    <!-- Beak -->
    <ellipse cx="0" cy="-9" rx="3.5" ry="2" fill="#f4a623"/>
    <!-- Feet -->
    <ellipse cx="-5" cy="15" rx="5" ry="2.5" fill="#f4a623"/>
    <ellipse cx="5" cy="15" rx="5" ry="2.5" fill="#f4a623"/>
  </g>

  <!-- "SSO" text -->
  <text x="64" y="108" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="11" font-weight="bold" fill="#00bcf2" letter-spacing="2">SSO</text>
</svg>
